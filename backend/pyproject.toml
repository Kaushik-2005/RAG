[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab-backend"
version = "0.1.0"
description = "FastAPI backend for RAG Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "langchain>=0.2,<1.0",
  "langchain-community>=0.2,<1.0",
  "sentence-transformers>=3.0,<4.0",
  "chromadb>=0.5,<1.0",
  "faiss-cpu>=1.8,<2.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "networkx>=3.3,<4.0",
  "groq>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
